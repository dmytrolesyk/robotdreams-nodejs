services:
  node:
    # Distinct tag so the dev build never overwrites the production image.
    image: robotdreams-node:dev
    build:
      context: .
      dockerfile: node.Dockerfile
      target: builder
    user: node
    volumes:
      - .:/build
      - /build/node_modules
    command: node --watch src/index.ts
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    develop:
      watch:
        - action: restart
          path: ./src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
